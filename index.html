<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>10 анимаций иероглифа</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #000; color: #fff; }
  body {
    margin: 0; min-height: 100dvh; background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 860px; padding: calc(24px + env(safe-area-inset-top)) 17px calc(36px + env(safe-area-inset-bottom)); margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.035em; }
  .sub { margin: 7px 0 22px; font-size: 12px; line-height: 1.5; color: #888; }
  .gallery { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px 12px; }
  .tile { min-width:0; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action: manipulation; }
  .frame { position:relative; width:100%; aspect-ratio: 1; border:1px solid #555; border-radius: 11px; overflow:hidden; background: #0b0b0b; transition:border-color .2s; }
  .tile:active .frame { border-color: #fff; }
  svg { width:100%; height:100%; display:block; }
  .grid-mark { stroke: #323232; stroke-width: .85; }
  .guide { fill:none; stroke: #333; stroke-linecap:round; stroke-linejoin:round; }
  .ink-path { fill:none; stroke: #f7f7f7; stroke-linecap:round; stroke-linejoin:round; }
  .ink-group { transform-box: fill-box; transform-origin: center; }
  .tip { fill: #fff; filter: drop-shadow(0 0 4px #aaa); opacity:0; }
  .tile-label { display:flex; align-items:baseline; gap:6px; padding:10px 3px 0; min-width:0; }
  .num { color:#777; font-size:11px; font-variant-numeric:tabular-nums; }
  .name { color:#e5e5e5; font-size:12px; font-weight:550; letter-spacing:-.012em; }
  .desc { padding: 3px 3px 0; color:#777; font-size:10px; line-height:1.4; }
  .bottom { padding-top: 22px; font-size:11px; color:#696969; text-align:center; }
  @media (min-width: 700px) {
    .gallery { grid-template-columns:repeat(5,minmax(0,1fr)); gap:24px 14px; }
    .page { padding-top: 46px; }
    h1 { font-size:26px; }
  }
  @media (max-width: 350px) {
    .page { padding-left: 12px; padding-right:12px; }
    .gallery { gap:16px 9px; }
    .name { font-size: 11px; }
  }
</style>
</head>
<body>
<main class="page">
  <h1>10 вариантов прорисовки</h1>
  <p class="sub">Один и тот же иероглиф 林. Все анимации повторяются автоматически. Нажми на окно, чтобы начать его цикл заново.</p>
  <section id="gallery" class="gallery" aria-label="Десять вариантов анимации"></section>
  <div class="bottom">Выбери вариант по номеру — его можно перенести в основное приложение.</div>
</main>
<script>
(() => {
  'use strict';

  // Восемь черт иероглифа 林. Только локальные SVG-пути, без сетевых зависимостей.
  const strokes = [
    { d: 'M 32 89 Q 67 87 108 89', width: 8.2 },
    { d: 'M 74 39 Q 77 91 74 189', width: 10.5 },
    { d: 'M 70 105 Q 53 143 24 171', width: 8.7 },
    { d: 'M 80 119 Q 94 135 108 150', width: 8.8 },
    { d: 'M 123 90 Q 168 88 216 88', width: 8.5 },
    { d: 'M 164 35 Q 170 116 165 206', width: 11 },
    { d: 'M 161 107 Q 146 155 114 185', width: 9.2 },
    { d: 'M 172 120 Q 194 165 224 193', width: 10 }
  ];

  const names = [
    ['Естественная', 'Ровные черты, краткая пауза'],
    ['Быстрое угасание', 'Лёгкий fade за 0,25 с'],
    ['Мягкое растворение', 'Длинный плавный fade'],
    ['Чернильный след', 'Светящийся кончик кисти'],
    ['Мягкая кисть', 'Толщина черты слегка меняется'],
    ['Обратное стирание', 'Черты исчезают в обратном порядке'],
    ['По одной', 'Каждая завершённая черта исчезает отдельно'],
    ['Боковая шторка', 'Готовый иероглиф стирается слева направо'],
    ['Воздушный переход', 'Небольшой подъём, размытие и fade'],
    ['Бесшовный цикл', 'Новая прорисовка начинается, пока старая тает']
  ];

  // The same geometry in every tile makes transition differences easy to compare.
  const NS = 'http://www.w3.org/2000/svg';
  const make = (tag, props, parent) => {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(props || {})) el.setAttribute(k, String(v));
    if (parent) parent.append(el);
    return el;
  };
  const ease = t => t * t * (3 - 2 * t);
  const clamp = (t, lo=0, hi=1) => Math.min(hi, Math.max(lo, t));
  const gallery = document.getElementById('gallery');
  const cards = [];

  function makeInkLayer(svg, cls) {
    const group = make('g', {class: cls + ' ink-group'}, svg);
    const paths = strokes.map(stroke => {
      const el = make('path', { d: stroke.d, class:'ink-path', 'stroke-width':stroke.width }, group);
      const length = el.getTotalLength();
      el.style.strokeDasharray = `${length} ${length + 3}`;
      el.style.strokeDashoffset = `${length}`;
      return {el,length,width:stroke.width};
    });
    return {group, paths};
  }

  for (let i=0; i<10; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `<div class="frame"><svg viewBox="0 0 240 240" role="img" aria-label="Анимация ${i+1}: ${names[i][0]}"></svg></div><div class="tile-label"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="name">${names[i][0]}</span></div><div class="desc">${names[i][1]}</div>`;
    gallery.append(tile);
    const svg = tile.querySelector('svg');
    make('line', {x1:120,y1:8,x2:120,y2:232,class:'grid-mark'}, svg);
    make('line', {x1:8,y1:120,x2:232,y2:120,class:'grid-mark'}, svg);
    const guide = make('g', {}, svg);
    strokes.forEach(s => make('path', {d:s.d, class:'guide', 'stroke-width':s.width + .5}, guide));
    const oldLayer = i===9 ? makeInkLayer(svg,'old') : null;
    const ink = makeInkLayer(svg,'active');
    const tip = make('circle', {class:'tip',r:5,cx:0,cy:0}, svg);

    const card = {i,tile,svg,ink,oldLayer,tip,start:performance.now(),duration:6100};
    tile.addEventListener('click', () => {card.start=performance.now(); renderCard(card,0);});
    cards.push(card);
  }

  // Unequal path lengths get proportionally more drawing time, like a real pen.
  const lengths = cards[0].ink.paths.map(p=>p.length);
  const totalLength = lengths.reduce((a,b)=>a+b,0);
  const fractions = lengths.map(l => l / totalLength);
  const cumulative = [0];
  for (const f of fractions) cumulative.push(cumulative.at(-1) + f);

  function resetLayer(layer) {
    layer.group.style.opacity = '1';
    layer.group.style.filter = 'none';
    layer.group.style.transform = 'none';
    layer.group.style.clipPath = 'none';
    layer.paths.forEach(p=> {p.el.style.strokeDashoffset = p.length; p.el.style.opacity='1'; p.el.style.strokeWidth=p.width;});
  }

  function draw(layer, progress, variant) {
    let active = -1;
    let activeProgress = 0;
    layer.paths.forEach((p,j)=> {
      let f = clamp((progress-cumulative[j]) / fractions[j]);
      if (variant===3 || variant===4) f=ease(f); // softer brush motion
      p.el.style.strokeDashoffset = (p.length * (1-f)).toFixed(2);
      p.el.style.opacity = '1';
      p.el.style.strokeWidth = variant===4 ? (p.width * (1.14 - 0.14 * f)).toFixed(2) : p.width;
      if (f>0 && f<1) {active=j; activeProgress=f;}
    });
    return {active, activeProgress};
  }

  function fullyDrawn(layer) {
    layer.paths.forEach(p=> {
      p.el.style.strokeDashoffset='0';
      p.el.style.opacity='1';
      p.el.style.strokeWidth=p.width;
    });
  }

  const cycle = 6100;
  const drawMs = 3700;
  const holdMs = 430;
  const exitMs = 950;

  function renderCard(card, localTime) {
    const {i,ink,oldLayer,tip} = card;
    const t = localTime % cycle;
    const progress = clamp(t / drawMs);
    const done = t >= drawMs;
    const exitStart = drawMs + holdMs;
    const finish = clamp((t-exitStart)/exitMs);
    resetLayer(ink);
    tip.style.opacity = '0';

    if (i===9) {
      // Crossfade the completed glyph into the first strokes of the new glyph.
      // No empty black instant between successive cycles.
      const newProgress = clamp(t/drawMs);
      draw(ink,newProgress,i);
      ink.group.style.opacity = String(1);
      if (oldLayer) {
        resetLayer(oldLayer);
        fullyDrawn(oldLayer);
        oldLayer.group.style.opacity = String(1-ease(clamp(t/1150)));
      }
      return;
    }

    const tipState = draw(ink, progress, i);
    if (i===3 && !done) {
      ink.group.style.filter='drop-shadow(0 0 3px rgba(255,255,255,.26))';
      const idx=tipState.active;
      if (idx>=0) {
        const point=ink.paths[idx].el.getPointAtLength(ink.paths[idx].length*tipState.activeProgress);
        tip.setAttribute('cx',point.x.toFixed(2));
        tip.setAttribute('cy',point.y.toFixed(2));
        tip.style.opacity=String(.83);
      }
    }

    if (!done) return;
    fullyDrawn(ink);
    if (t < exitStart) return;
    const smooth = ease(finish);

    switch(i) {
      case 0: // A conventional cycle: keep the finished character visible almost until restart.
        ink.group.style.opacity=String(1-clamp((t-(cycle-150))/150));
        break;
      case 1: // Quick but continuous fade.
        ink.group.style.opacity=String(1-ease(clamp((t-exitStart)/250)));
        break;
      case 2: // Slow fade throughout the end window.
        ink.group.style.opacity=String(1-smooth);
        break;
      case 3: // Soft glimmer after the writing, without hard flash.
        ink.group.style.opacity=String(1-smooth);
        ink.group.style.filter=`drop-shadow(0 0 ${((1-smooth)*5).toFixed(1)}px rgba(255,255,255,.38))`;
        break;
      case 4: // Variable pressure brush, gentle final fade.
        ink.group.style.opacity=String(1-smooth);
        break;
      case 5: { // Reverse erase each stroke.
        const r=smooth;
        ink.paths.forEach((p,j)=> {
          const revIndex=ink.paths.length-1-j;
          const each=1/ink.paths.length;
          const amount=clamp((r - revIndex*each)/each);
          p.el.style.strokeDashoffset = (p.length*amount).toFixed(2);
        });
        break;
      }
      case 6: { // Dissolve finished strokes one at a time, in sequence.
        const r=smooth;
        ink.paths.forEach((p,j)=> {
          const each=1/ink.paths.length;
          p.el.style.opacity=String(1-ease(clamp((r-j*each)/each)));
        });
        break;
      }
      case 7: // Wipe from left to right.
        ink.group.style.clipPath=`inset(0 0 0 ${(smooth*100).toFixed(1)}%)`;
        break;
      case 8: // Disappear softly upwards.
        ink.group.style.opacity=String(1-smooth);
        ink.group.style.filter=`blur(${(smooth*4).toFixed(2)}px)`;
        ink.group.style.transform=`translateY(${(-smooth*7).toFixed(1)}px) scale(${(1-smooth*.035).toFixed(3)})`;
        break;
    }
  }

  let raf=0;
  function tick(now) {
    for (const c of cards) renderCard(c, (now-c.start+cycle)%cycle);
    raf=requestAnimationFrame(tick);
  }
  raf=requestAnimationFrame(tick);
  document.addEventListener('visibilitychange',()=> {
    if(document.hidden) {cancelAnimationFrame(raf); raf=0;}
    else if(!raf) {
      const now=performance.now();
      cards.forEach(c=>c.start=now);
      raf=requestAnimationFrame(tick);
    }
  });
})();
</script>
</body>
</html>
